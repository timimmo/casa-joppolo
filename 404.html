<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden – Casa Joppolo</title>
<meta name="robots" content="noindex">
<style>
  /* Eigenständig, weil die 404-Seite unter jedem Pfad ausgeliefert wird und relative Pfade dann nicht stimmen. */
  :root { color-scheme: light; --paper: #f3ecdc; --ink: #23201c; --accent: #1b5fa0; --muted: #5e564c; }
  
  html { background: var(--paper); color: var(--ink); font-family: "Iowan Old Style", Palatino, Georgia, serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
  main { max-width: 36rem; }
  .label { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
  h1 { font-family: "Cormorant Garamond", "Iowan Old Style", Palatino, Georgia, serif; font-weight: 500; font-size: clamp(2rem, 1.3rem + 3vw, 3.5rem); line-height: 1; margin: .75rem 0 1.25rem; letter-spacing: -.01em; }
  p { font-size: 1.15rem; line-height: 1.45; margin: 0; }
  a { color: var(--accent); text-underline-offset: .16em; }
  a:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="label">Casa Joppolo</p>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Vielleicht ist sie ein Lost Place. <a href="https://timimmo.github.io/casa-joppolo/">Zur Startseite</a>.</p>
</main>
</body>
</html>
